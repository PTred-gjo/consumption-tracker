<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Track fuel consumption, real cost per kilometre and vehicle maintenance. All data stays on your device." />
    <!-- Kept in step with the in-app theme toggle at runtime. -->
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FuelPilot" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>FuelPilot — Fuel &amp; Maintenance Tracker</title>

    <style>
      /* Painted before the bundle loads so the first frame is not a white flash
         on a dark-themed device. */
      html { background: #0a0a0a; }
      @media (prefers-color-scheme: light) {
        html { background: #f2f2f7; }
      }
      body { margin: 0; }
      /* Stops the pull-to-refresh gesture from firing during a swipe between tabs. */
      body { overscroll-behavior-y: contain; }
      .fp-noscript {
        color: #f5f5f3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
        text-align: center;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="fp-noscript">
        <h1>FuelPilot</h1>
        <p>FuelPilot needs JavaScript to run. Please enable it and reload the page.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
