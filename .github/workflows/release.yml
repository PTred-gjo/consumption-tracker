name: Release

# Builds the artifacts needed for a Play Store submission.
#
# Requires these repository secrets (see docs/PUBLISHING.md):
#   ANDROID_KEYSTORE_BASE64  — the .jks upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Without them the job still runs and produces an unsigned bundle, so the
# pipeline can be validated before the signing key exists.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm run test

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        # A mismatch would ship a bundle whose in-app version disagrees with the
        # release it was cut from.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing version $PKG"

      - name: Build web app and sync Capacitor
        run: npm run build:android

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No keystore secret configured — the bundle will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release bundle and APK
        working-directory: android
        env:
          FUELPILOT_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          FUELPILOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FUELPILOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FUELPILOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Monotonic and unique per run, which is what Play requires.
          FUELPILOT_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuelpilot-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
