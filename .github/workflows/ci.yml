name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build web app
        run: npm run build

      - name: Verify PWA assets are present
        # The manifest referenced icons that were not in the repository, which
        # silently made the app non-installable. Fail the build instead.
        run: |
          set -euo pipefail
          for f in index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing or empty"
              exit 1
            fi
          done
          echo "All required PWA assets present."

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        # Drives the production build in a real browser: onboarding, logging a
        # refuel, the computed consumption figure, every tab, and persistence.
        run: |
          set -euo pipefail
          npm run preview &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4173/; then break; fi
            if [ "$i" -eq 30 ]; then echo "::error::preview server never came up"; exit 1; fi
            sleep 2
          done
          npm run test:e2e

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7
