name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build web app
        run: npm run build

      - name: Verify PWA assets are present
        # The manifest referenced icons that were not in the repository, which
        # silently made the app non-installable. Fail the build instead.
        run: |
          set -euo pipefail
          for f in index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing or empty"
              exit 1
            fi
          done
          echo "All required PWA assets present."

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build web app and sync Capacitor
        run: npm run build:android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fuelpilot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
